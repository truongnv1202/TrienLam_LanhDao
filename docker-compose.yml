# Local:  docker compose up -d --build
# Server (lần đầu):
#   sudo bash deploy/setup-admin-env.sh    # tạo deploy/env.server + mật khẩu
#   bash deploy/docker-up.sh --build
# Hoặc: sudo bash deploy/server-up.sh

services:
  lanhdao:
    build:
      context: ${APP_ROOT:-.}
      dockerfile: Dockerfile
    container_name: trienlam-lanhdao
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-5006}:3000"
    env_file:
      - ${APP_ROOT:-.}/deploy/env.server
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      - ${APP_ROOT:-.}/data:/app/data
      - ${APP_ROOT:-.}/public/uploads:/app/public/uploads
      - ${APP_ROOT:-.}/public/videos:/app/public/videos
      - ${APP_ROOT:-.}/public/fonts:/app/public/fonts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
