# Subdomain quản trị (tùy chọn) — admin.lanhdao.gamegiaoduc.co
# Cloudflare DNS: A record "admin.lanhdao" → cùng IP server (proxy ON)
# Cùng upstream Docker :5006 — middleware Next.js rewrite → /admin

# upstream lanhdao_app → /etc/nginx/conf.d/lanhdao-upstream.conf

server {
    listen 80;
    listen [::]:80;
    server_name admin.lanhdao.gamegiaoduc.co;

    client_max_body_size 10M;
    access_log /var/log/nginx/lanhdao-admin.access.log;
    error_log  /var/log/nginx/lanhdao-admin.error.log warn;

    location / {
        proxy_pass http://lanhdao_app;
        include /etc/nginx/snippets/lanhdao-proxy.conf;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Sau enable-ssl.sh: thêm block 443 tương tự lanhdao.gamegiaoduc.co.ssl.conf
