# lanhdao.gamegiaoduc.co — HTTP :80 + HTTPS :443
# upstream → /etc/nginx/conf.d/lanhdao-upstream.conf
# Certificate: sudo bash deploy/nginx/enable-ssl.sh

# --- HTTP :80 ---
server {
    listen 80;
    listen [::]:80;
    server_name lanhdao.gamegiaoduc.co;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/TrienLam_LanhDao/public/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lanhdao.gamegiaoduc.co;

    ssl_certificate     /etc/letsencrypt/live/lanhdao.gamegiaoduc.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lanhdao.gamegiaoduc.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;
    access_log /var/log/nginx/lanhdao.access.log;
    error_log  /var/log/nginx/lanhdao.error.log warn;

    include /etc/nginx/snippets/lanhdao-locations.conf;
}
