# Triển lãm Lãnh đạo — lanhdao.gamegiaoduc.co
# Copy vào server (ví dụ Debian/Ubuntu):
#   sudo cp deploy/nginx/lanhdao.gamegiaoduc.co.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/lanhdao.gamegiaoduc.co.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Docker app phải chạy và lắng nghe 127.0.0.1:5006 (docker-compose.yml)
# Cloudflare: A/AAAA record → IP server; SSL/TLS khuyến nghị "Full" hoặc "Full (strict)"

# Cloudflare — tin cậy IP gốc thật (tùy chọn, bật nếu cần log IP user)
# include /etc/nginx/cloudflare.conf;

upstream lanhdao_app {
    server 127.0.0.1:5006;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name lanhdao.gamegiaoduc.co;

    # Nếu dùng Certbot trên origin (Cloudflare Full strict):
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/lanhdao.gamegiaoduc.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lanhdao.gamegiaoduc.co/privkey.pem;

    client_max_body_size 10M;

    access_log /var/log/nginx/lanhdao.access.log;
    error_log  /var/log/nginx/lanhdao.error.log;

    location / {
        proxy_pass http://lanhdao_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Cloudflare gửi HTTPS tới user; origin có thể chỉ HTTP
        # (Cloudflare SSL mode: Flexible → scheme http; Full → https nếu có cert origin)
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://lanhdao_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
