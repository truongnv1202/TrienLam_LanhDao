# lanhdao.gamegiaoduc.co — HTTP :80 + HTTPS :443
# Chạy: sudo bash deploy/nginx/enable-ssl.sh

# --- HTTP :80 (proxy + ACME — tương thích Cloudflare Flexible) ---
server {
    listen 80;
    listen [::]:80;
    server_name lanhdao.gamegiaoduc.co;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/TrienLam_LanhDao/public/certbot;
        allow all;
    }

    client_max_body_size 10M;
    access_log /var/log/nginx/lanhdao.access.log;
    error_log  /var/log/nginx/lanhdao.error.log warn;

    include /etc/nginx/snippets/lanhdao-locations.conf;
}

# --- HTTPS :443 (Cloudflare Full / Full strict) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lanhdao.gamegiaoduc.co;

    ssl_certificate     /etc/letsencrypt/live/lanhdao.gamegiaoduc.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lanhdao.gamegiaoduc.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;
    access_log /var/log/nginx/lanhdao.access.log;
    error_log  /var/log/nginx/lanhdao.error.log warn;

    include /etc/nginx/snippets/lanhdao-locations.conf;
}
