# =============================================================================
# Triển lãm Lãnh đạo — lanhdao.gamegiaoduc.co
# Mã nguồn server: /opt/TrienLam_LanhDao
# Docker app:      127.0.0.1:5006
# =============================================================================
#
# TRIỂN KHAI:
#   sudo mkdir -p /opt/TrienLam_LanhDao
#   # đưa code vào /opt/TrienLam_LanhDao (git clone / rsync / scp)
#   cd /opt/TrienLam_LanhDao && docker compose --env-file deploy/env.server up -d --build
#   cd /opt/TrienLam_LanhDao && sudo bash deploy/nginx/install.sh
#
# Cloudflare: A/AAAA → IP server | SSL: Full hoặc Full (strict)
# =============================================================================

upstream lanhdao_app {
    server 127.0.0.1:5006;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name lanhdao.gamegiaoduc.co;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/TrienLam_LanhDao/public/certbot;
        allow all;
    }

    # Bật sau khi có SSL origin:
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Real IP Cloudflare (tùy chọn — bật nếu cần log IP thật):
    # include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 10M;

    access_log /var/log/nginx/lanhdao.access.log;
    error_log  /var/log/nginx/lanhdao.error.log warn;

    # Ảnh upload — phục vụ trực tiếp từ /opt/TrienLam_LanhDao (bỏ comment để bật)
    # location /uploads/ {
    #     alias /opt/TrienLam_LanhDao/public/uploads/;
    #     expires 30d;
    #     add_header Cache-Control "public";
    #     access_log off;
    # }

    location /_next/static/ {
        proxy_pass http://lanhdao_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /videos/ {
        proxy_pass http://lanhdao_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /images/ {
        proxy_pass http://lanhdao_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /api/leaders/upload {
        proxy_pass http://lanhdao_app;
        include /etc/nginx/snippets/lanhdao-proxy.conf;
        client_max_body_size 10M;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://lanhdao_app;
        include /etc/nginx/snippets/lanhdao-proxy.conf;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

