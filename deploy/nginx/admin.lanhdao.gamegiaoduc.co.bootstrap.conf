# Chỉ HTTP — bootstrap trước SSL
# upstream → /etc/nginx/conf.d/lanhdao-upstream.conf

server {
    listen 80;
    listen [::]:80;
    server_name admin.lanhdao.gamegiaoduc.co;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/TrienLam_LanhDao/public/certbot;
        allow all;
    }

    client_max_body_size 10M;
    access_log /var/log/nginx/lanhdao-admin.access.log;
    error_log  /var/log/nginx/lanhdao-admin.error.log warn;

    location / {
        proxy_pass http://lanhdao_app;
        include /etc/nginx/snippets/lanhdao-proxy.conf;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
