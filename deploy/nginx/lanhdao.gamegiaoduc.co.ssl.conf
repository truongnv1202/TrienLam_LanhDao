# HTTP + HTTPS — dùng SAU khi đã có certificate (enable-ssl.sh)
# Cloudflare: SSL/TLS = Full hoặc Full (strict)

upstream lanhdao_app {
    server 127.0.0.1:5006;
    keepalive 32;
}

# HTTP → redirect HTTPS + Certbot renew
server {
    listen 80;
    listen [::]:80;
    server_name lanhdao.gamegiaoduc.co;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/TrienLam_LanhDao/public/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS :443
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lanhdao.gamegiaoduc.co;

    ssl_certificate     /etc/letsencrypt/live/lanhdao.gamegiaoduc.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lanhdao.gamegiaoduc.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;
    access_log /var/log/nginx/lanhdao.access.log;
    error_log  /var/log/nginx/lanhdao.error.log warn;

    include /etc/nginx/snippets/lanhdao-locations.conf;
}
