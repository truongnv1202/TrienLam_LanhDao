# Chỉ HTTP — dùng lần đầu trước khi có certificate.
# App này chạy tách trên /opt/TrienLam_LanhDao_v2 và cổng 5007.

server {
    listen 80;
    listen [::]:80;
    server_name lanhdao.gamegiaoduc.co;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/TrienLam_LanhDao_v2/public/certbot;
        allow all;
    }

    client_max_body_size 10M;
    access_log /var/log/nginx/lanhdao.access.log;
    error_log  /var/log/nginx/lanhdao.error.log warn;

    include /etc/nginx/snippets/lanhdao2-locations.conf;
}
