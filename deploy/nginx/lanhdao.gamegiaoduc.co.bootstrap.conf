# Chỉ HTTP — dùng LẦN ĐẦU trước khi có certificate (enable-ssl.sh tự chuyển sang bản có 443)
# upstream → /etc/nginx/conf.d/lanhdao-upstream.conf

server {
    listen 80;
    listen [::]:80;
    server_name lanhdao.gamegiaoduc.co;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/TrienLam_LanhDao/public/certbot;
        allow all;
    }

    client_max_body_size 10M;
    access_log /var/log/nginx/lanhdao.access.log;
    error_log  /var/log/nginx/lanhdao.error.log warn;

    include /etc/nginx/snippets/lanhdao-locations.conf;
}
